name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip3 install -r requirements.txt
    
        # Настройка Docker для Selenoid
    - name: Configure Docker for Selenoid
      run: |
        echo '{"min-api-version": "1.24"}' | sudo tee /etc/docker/daemon.json
        sudo systemctl restart docker

    # Скачиваем образ браузера, чтобы Selenoid мог его использовать
    - name: Pull Selenoid browser image
      run: |
        docker pull selenoid/chrome:125.0

    # Запуск Selenoid и тестов
    - name: Run tests with Docker Compose
      run: |
        docker compose up --abort-on-container-exit --exit-code-from test